{% extends "base.html" %}

{% block title %}Create Account — CampusFind{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="text-align: center; display: block; padding: 1.5rem 1.25rem 1rem 1.25rem;">
            <h2 style="font-size: 1.5rem; color: var(--dark);">Create Campus Account</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">Join CampusFind to report, track, and recover items across the university.</p>
        </div>

        <div class="card-body">
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Name <span class="required">*</span></label>
                    <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Alex Johnson" required autofocus>
                </div>

                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="email">Campus Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@campusfind.edu" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="student_id">Roll No / Student ID</label>
                        <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g. 21BCE1024">
                    </div>
                </div>

                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="phone">Contact Phone</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. +91 9876543210">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="role">Campus Role</label>
                        <select id="role" name="role" class="form-control">
                            <option value="student">Student</option>
                            <option value="staff">Faculty / Staff Member</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="confirm_password">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem; padding: 0.75rem;">Create Account</button>
            </form>
        </div>

        <div class="card-footer" style="text-align: center; font-size: 0.88rem;">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
